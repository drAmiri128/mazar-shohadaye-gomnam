<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مزار شهدای گمنام</title>
<style>
body{margin:0;font-family:Tahoma,Arial;background:#0f172a;color:#fff}
.hero{text-align:center;padding:70px 20px;background:linear-gradient(135deg,#111827,#334155)}
h1{font-size:38px;margin-bottom:15px}
p{font-size:18px;line-height:2}
.btn{display:inline-block;margin-top:25px;padding:15px 35px;background:#d4a72c;color:#111827;text-decoration:none;border-radius:30px;font-weight:bold}
.section{padding:35px 20px;max-width:900px;margin:auto}
.cards{display:flex;flex-wrap:wrap;gap:15px;justify-content:center}
.card{background:#1e293b;padding:20px;border-radius:18px;width:220px;text-align:center}
.footer{text-align:center;padding:25px;color:#cbd5e1}
</style>
</head>
<body>
<section class="hero">
<h1>🕊️ مزار شهدای گمنام</h1>

<a class="btn" href="#">دانلود برنامه اندروید (به‌زودی)</a>
</section>

<section class="section">
<h2>امکانات برنامه</h2>
<div class="cards">
<div class="card">📍 معرفی مزارها</div>
<div class="card">🕯️ اطلاعات شهدا</div>
<div class="card">🗺️ موقعیت و دسترسی</div>
</div>
</section>

<section class="section">
<h2>آخرین نسخه</h2>
<p>نسخه: 1.0.0<br>وضعیت: به‌زودی منتشر می‌شود</p>
</section>

<div class="footer">مزار شهدای گمنام</div>
</body>
</html>
